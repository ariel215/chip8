[package]
name = "chip8cc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type= ["rlib"]

[dependencies]
anyhow = "1.0.98"
bumpalo = { version = "3.17.0", features = ["boxed"] }
chippy-lib = {path = "../chippy-lib"}
clap = { version = "4.5.9", features = ["derive"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
itertools = "0.13.0"
nom = "8.0.0"
nom-supreme = { git = "https://github.com/nobie-org/nom-supreme.git", branch="matt/chore/upgrade-to-nom-v8" }
pest = "2.7.14"
pest_consume = "1.1.3"
pest_derive = { version = "2.7.14", features = ["grammar-extras"] }
