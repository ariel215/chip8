[package]
name = "chippy-lib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["rlib","cdylib"]

[dependencies]
itertools = "0.13.0"
ndarray = "0.15.6"
rand = "0.8.5"
wasm-bindgen = {version="0.2.93", optional = true}

[features]
wasm = ["dep:wasm-bindgen"]
