[package]
name = "chippy"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
bitvec = "1.0.1"
clap = { version = "4.5.9", features = ["derive"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
raylib = { version = "5.0.1", optional = true }
wasm-bindgen = { version = "0.2.93", optional = true }
chippy-lib = { path = "../chippy-lib" }
itertools = "0.14.0"
cfg-if = "1.0.1"
getrandom = {version = "0.2.16", features = ["js"]}
egui-miniquad = {version = "0.16.0", optional = true}
egui = { version = "0.31.1", optional = true }
rfd = "0.15.3"
async-std = {version = "1.13.1", optional = true } 
miniquad = { version = "0.4", optional = true } 

[features]
raylib = ["dep:raylib"]
default = ["raylib"]
egui = ["dep:wasm-bindgen","dep:egui-miniquad", "dep:egui", "dep:async-std", "dep:miniquad", "chippy-lib/wasm"]
